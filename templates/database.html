<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FASTag Database Stream</title>
    <style>
        body {
            background-color: var(--bg);
            background-image: radial-gradient(var(--primary-soft) 2px, transparent 2px);
            background-size: 30px 30px;
            font-family: monospace;
            color: #111;
            padding: 20px;
        }
        h1 { text-align: center; }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        th { background: var(--primary-soft); }
        tr:nth-child(even) { background: #f9f9f9; }
        .ping-id { font-size: 0.8em; color: #555; }
    body{background:var(--bg);background-image:linear-gradient(180deg,var(--primary-soft),var(--bg) 280px);color:var(--text);font-family:var(--font-body)}.container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg)}h1{font-family:var(--font-display);color:var(--text)}a{color:var(--primary);font-weight:600}th{background:var(--surface-alt);color:var(--text-muted);position:sticky;top:0;z-index:1}th,td{border-bottom-color:var(--border)}tr:nth-child(even){background:var(--surface-alt)}</style>
    <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
    <div class="container">
        <h1>Live Database Stream (NoSQL)</h1>
        <p style="text-align: center;"><a href="/">← Back to Dashboard</a></p>
        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Ping ID</th>
                    <th>Plaza ID</th>
                    <th>Tag ID</th>
                    <th>RSSI</th>
                </tr>
            </thead>
            <tbody id="db-body">
            </tbody>
        </table>
    </div>
    
    <script>
        async function fetchDB() {
            try {
                const res = await fetch('/api/database/tail');
                const json = await res.json();
                const tbody = document.getElementById('db-body');
                tbody.innerHTML = '';
                
                json.data.forEach(ping => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${ping.ping_timestamp}</td>
                        <td class="ping-id">${ping.ping_id}</td>
                        <td>${ping.plaza_id}</td>
                        <td>${ping.tag_id}</td>
                        <td>${ping.rssi_signal_strength} dBm</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
            }
        }
        
        fetchDB();
        setInterval(fetchDB, 1000);
    </script>
</body>
</html>
