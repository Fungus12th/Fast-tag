<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FASTag Database Stream</title>
    <style>
        body {
            background-color: #e0f2e9;
            background-image: radial-gradient(#9acbb3 2px, transparent 2px);
            background-size: 30px 30px;
            font-family: monospace;
            color: #111;
            padding: 20px;
        }
        h1 { text-align: center; }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        th { background: #9acbb3; }
        tr:nth-child(even) { background: #f9f9f9; }
        .ping-id { font-size: 0.8em; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Live Database Stream (NoSQL)</h1>
        <p style="text-align: center;"><a href="/">← Back to Dashboard</a></p>
        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Ping ID</th>
                    <th>Plaza ID</th>
                    <th>Tag ID</th>
                    <th>RSSI</th>
                </tr>
            </thead>
            <tbody id="db-body">
            </tbody>
        </table>
    </div>
    
    <script>
        async function fetchDB() {
            try {
                const res = await fetch('/api/database/tail');
                const json = await res.json();
                const tbody = document.getElementById('db-body');
                tbody.innerHTML = '';
                
                json.data.forEach(ping => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${ping.ping_timestamp}</td>
                        <td class="ping-id">${ping.ping_id}</td>
                        <td>${ping.plaza_id}</td>
                        <td>${ping.tag_id}</td>
                        <td>${ping.rssi_signal_strength} dBm</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
            }
        }
        
        fetchDB();
        setInterval(fetchDB, 1000);
    </script>
</body>
</html>
