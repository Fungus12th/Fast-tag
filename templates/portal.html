<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Owner Portal</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f4f4f4;}
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; margin: 10px; width: 250px;}
        .btn { display: block; padding: 10px; background: #0b4a22; color: white; text-decoration: none; border-radius: 4px; margin-top: 15px;}
    </style>
</head>
<body>
    <div style="text-align: center; margin-bottom: 20px;">
        <a href="/" style="color: #0b4a22; text-decoration: none; font-weight: bold; font-size: 1.1em;">← Back to Dashboard</a>
    </div>
    <h1>FASTag Owner Portal Login</h1>
    <p>Select your account to view your vehicles' travel history</p>
    
    <div>
        {% for owner_id, info in owners.items() %}
        <div class="card">
            <h3>{{ info.name }}</h3>
            <p>{{ info.cars|length }} Vehicles Registered</p>
            <a href="/portal/{{ info.username }}" class="btn">Login as {{ info.name }}</a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
